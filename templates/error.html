<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Error - TimeTask School</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        h1 {
            color: var(--danger);
            font-size: 22px;
            margin-top: 0;
        }

        p {
            color: #4b5563;
            font-size: 14px;
            line-height: 1.5;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #4338ca;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>¡Atención! ⚠️</h1>
        <p>{{ error_message }}</p>
        <a href="{{ back_url }}" class="btn">Volver a intentar</a>
    </div>
</body>

</html>
