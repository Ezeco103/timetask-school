<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro - TimeTask School</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        h1 {
            color: var(--primary);
            font-size: 26px;
            margin-top: 0;
        }

        label {
            font-weight: 600;
            font-size: 13px;
            display: block;
            text-align: left;
            margin-bottom: 5px;
            color: #4b5563;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            width: 100%;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .error-msg {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .link-text {
            margin-top: 20px;
            font-size: 14px;
            color: #6b7280;
        }

        .link-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .link-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>TimeTask School 🚀</h1>
        <p style="color: #6b7280; font-size: 14px; margin-bottom: 25px;">Crea tu cuenta profesional gratuita.</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label for="username">Elige un Nombre de Usuario:</label>
            <input type="text" id="username" name="username" placeholder="Ej. user123" required autocomplete="off">

            <label for="password">Contraseña segura:</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit" class="btn">Crear Cuenta</button>
        </form>

        <div class="link-text">
            ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
        </div>
    </div>
</body>

</html>
